<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b2a3b" />
  <meta name="description" content="PWA offline para consulta de lubrificantes por TAG/descrição - P-76" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Carta de Lubrificação P-76</title>
</head>

<body>
  <header class="topbar">
    <div class="topbar__title">Carta de Lubrificação P-76</div>
    <div class="topbar__subtitle">Consulta offline por TAG ou descrição</div>
  </header>

  <main class="container">

    <!-- VIEW: SEARCH -->
    <section id="view-search" class="view view--active" aria-label="Busca">
      <div class="searchbox">
        <input id="q" class="searchbox__input" type="search"
               placeholder="Digite TAG ou palavras da descrição…"
               autocomplete="off" spellcheck="false" />
        <button id="btn-clear" class="btn btn--ghost" type="button">Limpar</button>
      </div>

      <div class="statusrow">
        <div id="status" class="status">Carregando base…</div>
        <div id="count" class="count"></div>
      </div>

      <div id="results" class="results" aria-label="Resultados"></div>
    </section>

    <!-- VIEW: DETAIL -->
    <section id="view-detail" class="view" aria-label="Detalhe">
      <button id="btn-back" class="btn btn--ghost" type="button">← Voltar</button>

      <article class="card card--detail">
        <div class="detail__label">LUBRIFICANTE UTILIZADO</div>
        <div id="d-lub" class="detail__lub">—</div>

        <div class="detail__row">
          <div class="detail__k">N.M. (lubrificante)</div>
          <div id="d-nm" class="detail__v">—</div>
        </div>

        <hr class="divider"/>

        <div class="detail__row">
          <div class="detail__k">TAG</div>
          <div id="d-tag" class="detail__v">—</div>
        </div>

        <div class="detail__row">
          <div class="detail__k">Descrição do equipamento</div>
          <div id="d-desc" class="detail__v">—</div>
        </div>

        <div class="detail__row">
          <div class="detail__k">Sistema</div>
          <div id="d-sistema" class="detail__v">—</div>
        </div>

        <div class="detail__row">
          <div class="detail__k">Local</div>
          <div id="d-local" class="detail__v">—</div>
        </div>

        <div class="detail__row">
          <div class="detail__k">Descrição do N.M.</div>
          <div id="d-nm-desc" class="detail__v detail__v--small">—</div>
        </div>

        <div class="detail__actions">
          <button id="btn-copy" class="btn btn--primary" type="button">
            Copiar lubrificante + NM
          </button>
        </div>
      </article>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
